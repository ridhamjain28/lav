<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>for you ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a0f1f;
    --panel: #281730;
    --rose: #e587ad;
    --gold: #dfb277;
    --gold-soft: rgba(223, 178, 119, 0.3);
    --cream: #f8eee9;
    --muted: #a68b9d;
    --danger: #e66b6b;
    --line: rgba(248, 238, 233, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(1000px 500px at 50% 0%, #2f1738 0%, var(--bg) 100%);
    color: var(--cream);
    font-family: 'Cormorant Garamond', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 36px;
    overflow-x: hidden;
    touch-action: manipulation;
    -webkit-font-smoothing: antialiased;
  }

  /* ambient floating stars */
  .stars {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 30px 40px, rgba(248,238,233,0.3), transparent),
      radial-gradient(1px 1px at 150px 120px, rgba(229,135,173,0.3), transparent),
      radial-gradient(1.5px 1.5px at 320px 220px, rgba(223,178,119,0.35), transparent),
      radial-gradient(1px 1px at 450px 90px, rgba(248,238,233,0.25), transparent);
    background-size: 500px 300px;
    animation: drift 70s linear infinite;
  }
  @keyframes drift { from { background-position: 0 0; } to { background-position: 500px 300px; } }

  /* floating hearts background layer */
  .hearts-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .bg-heart {
    position: absolute;
    color: var(--rose);
    opacity: 0.12;
    will-change: transform, opacity;
    animation-name: floatHeart;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  .bg-heart.gold { color: var(--gold); }
  @keyframes floatHeart {
    0% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-25px) rotate(8deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }

  /* Layout & columns */
  .app-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: max-width 0.3s ease;
  }

  @media (min-width: 860px) {
    .app-wrap {
      max-width: 900px;
    }
  }

  .main-layout {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  @media (min-width: 860px) {
    .main-layout {
      display: grid;
      grid-template-columns: 440px 1fr;
      gap: 28px;
      align-items: start;
    }
  }

  .board-column {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* The Diary Panel */
  .diary-card {
    width: 100%;
    background: radial-gradient(120% 100% at 50% 0%, #351c3f 0%, var(--panel) 100%);
    border: 1.5px solid var(--gold-soft);
    border-radius: 16px;
    padding: 24px 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.4), inset 0 0 20px rgba(223, 178, 119, 0.04);
    position: relative;
    overflow: hidden;
  }

  .diary-header {
    text-align: center;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(223, 178, 119, 0.2);
    position: relative;
  }

  .diary-title {
    font-family: 'Caveat', cursive;
    font-size: 32px;
    color: var(--gold);
    line-height: 1.1;
    font-weight: 700;
  }

  .diary-content {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 240px;
  }

  .diary-entry {
    font-family: 'Caveat', cursive;
    font-size: 24px;
    color: var(--gold);
    line-height: 1.4;
    padding: 6px 10px 8px;
    border-bottom: 1px dashed rgba(223, 178, 119, 0.25);
    transition: all 0.4s ease;
    min-height: 40px;
    display: flex;
    align-items: center;
  }

  .diary-entry.unlocked {
    animation: writeLine 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* Stagger-in for diary entries restored on page reload */
  .diary-entry.stagger-in {
    opacity: 0;
    animation: writeLine 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: var(--stagger-delay, 0ms);
  }

  .diary-entry.empty {
    opacity: 0.25;
    color: var(--muted);
    font-size: 20px;
    letter-spacing: 3px;
  }

  @keyframes writeLine {
    0% { opacity: 0; transform: translateX(-12px); }
    100% { opacity: 1; transform: translateX(0); }
  }

  /* Hearty "yayyyyy" Celebration Overlay */
  .yay-overlay {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .yay-overlay.show {
    opacity: 1;
  }

  .yay-popup {
    background: radial-gradient(circle at 50% 0%, #4a2155 0%, #25122b 100%);
    border: 2px solid var(--rose);
    box-shadow: 0 0 40px rgba(229, 135, 173, 0.4), 0 20px 50px rgba(0,0,0,0.7);
    border-radius: 24px;
    padding: 24px 38px;
    text-align: center;
    transform: scale(0.4) rotate(-6deg);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .yay-overlay.show .yay-popup {
    transform: scale(1) rotate(0deg);
  }

  .yay-hearts {
    font-size: 32px;
    margin-bottom: 6px;
    animation: pulseKiss 1.2s infinite ease-in-out;
  }

  .yay-text {
    font-family: 'Caveat', cursive;
    font-size: 42px;
    font-weight: 700;
    color: var(--gold);
    line-height: 1.1;
    text-shadow: 0 0 15px rgba(223, 178, 119, 0.5);
  }

  .yay-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--rose);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* top bar */
  .top-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  /* full music player */
  .music-player {
    width: 100%;
    background: rgba(40, 23, 48, 0.75);
    border: 1px solid var(--gold-soft);
    border-radius: 999px;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 12px;
    backdrop-filter: blur(10px);
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
  }

  .player-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .player-btn {
    background: rgba(223, 178, 119, 0.1);
    border: 1px solid rgba(223, 178, 119, 0.3);
    color: var(--gold);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    padding: 0;
  }

  .player-btn:hover {
    background: var(--gold);
    color: var(--bg);
    border-color: var(--gold);
    transform: scale(1.08);
  }

  .player-btn:active {
    transform: scale(0.95);
  }

  .player-btn.play-pause-btn {
    width: 32px;
    height: 32px;
    background: rgba(229, 135, 173, 0.2);
    border-color: var(--rose);
    color: var(--rose);
  }

  .player-btn.play-pause-btn:hover {
    background: var(--rose);
    color: var(--bg);
    border-color: var(--rose);
  }

  .player-progress-wrap {
    flex: 1;
    min-width: 120px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .player-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
    flex-shrink: 0;
    min-width: 26px;
  }
  .player-time.right {
    text-align: right;
  }

  .player-seekbar {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: rgba(248, 238, 233, 0.15);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
    transition: background 0.2s;
  }

  .player-seekbar::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--gold);
    cursor: pointer;
    box-shadow: 0 0 6px rgba(223, 178, 119, 0.6);
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .player-seekbar::-webkit-slider-thumb:hover {
    transform: scale(1.3);
    background: var(--rose);
  }

  .player-seekbar::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--gold);
    border: none;
    cursor: pointer;
    box-shadow: 0 0 6px rgba(223, 178, 119, 0.6);
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .player-seekbar::-moz-range-thumb:hover {
    transform: scale(1.3);
    background: var(--rose);
  }

  .kiss-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(229, 135, 173, 0.15);
    border: 1px solid rgba(229, 135, 173, 0.4);
    padding: 6px 12px;
    border-radius: 999px;
    color: var(--rose);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.2s ease;
    user-select: none;
  }
  .kiss-btn:hover {
    border-color: var(--rose);
    background: rgba(229, 135, 173, 0.25);
    transform: scale(1.03);
  }
  .kiss-btn:active {
    transform: scale(0.95);
  }
  .kiss-icon {
    font-size: 13px;
    animation: pulseKiss 2s infinite ease-in-out;
  }
  @keyframes pulseKiss {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }
  .kiss-particle {
    position: fixed;
    pointer-events: none;
    z-index: 100;
    font-size: 20px;
    animation: floatKiss 1.8s ease-out forwards;
  }
  @keyframes floatKiss {
    0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-70px) scale(1.5) rotate(15deg); opacity: 0; }
  }

  .level-dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(248, 238, 233, 0.2);
    transition: all 0.3s ease;
  }
  .dot.active { background: var(--rose); box-shadow: 0 0 8px rgba(229, 135, 173, 0.5); transform: scale(1.2); }
  .dot.done { background: var(--gold); }

  /* note preview card */
  .note-card {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 20px;
    margin-bottom: 18px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  }
  .note-card .title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .note-card .text {
    font-family: 'Caveat', cursive;
    font-size: 26px;
    color: var(--gold);
    min-height: 32px;
    line-height: 1.3;
    transition: all 0.3s ease;
  }
  .note-card .text .solved-part { color: var(--gold); }
  .note-card .text .locked-part { color: var(--muted); opacity: 0.4; letter-spacing: 2px; }

  /* sudoku grid */
  .board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    width: 100%;
    aspect-ratio: 1/1;
    background: var(--line);
    gap: 1px;
    border: 2px solid var(--gold-soft);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    margin-bottom: 18px;
  }
  .cell {
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(16px, 4.5vw, 20px);
    color: var(--cream);
    cursor: pointer;
    user-select: none;
    transition: background 0.15s ease;
    position: relative;
  }
  .cell.given {
    color: var(--muted);
    font-weight: 500;
    background: rgba(40, 23, 48, 0.85);
  }
  .cell.selected {
    background: rgba(229, 135, 173, 0.25) !important;
    box-shadow: inset 0 0 0 2px var(--rose);
  }
  .cell.highlight-same {
    background: rgba(223, 178, 119, 0.15);
  }
  .cell.highlight-axis {
    background: rgba(248, 238, 233, 0.04);
  }
  .cell.conflict {
    color: var(--danger) !important;
    background: rgba(230, 107, 107, 0.2) !important;
  }
  .cell.border-r { border-right: 2px solid var(--gold-soft); }
  .cell.border-b { border-bottom: 2px solid var(--gold-soft); }

  /* hidden input to smoothly summon native iOS/Android numeric keyboard */
  #nativeInput {
    position: absolute;
    opacity: 0;
    pointer-events: none;
    left: -9999px;
    top: -9999px;
    font-size: 16px; /* Prevents auto-zoom in iOS Safari */
    width: 1px;
    height: 1px;
  }

  /* actions */
  .controls {
    display: flex;
    gap: 12px;
    width: 100%;
  }
  .btn {
    flex: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid var(--gold-soft);
    background: rgba(40, 23, 48, 0.6);
    color: var(--gold);
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
  }
  .btn:hover { background: var(--gold); color: var(--bg); }
  .btn.primary {
    background: var(--rose);
    border-color: var(--rose);
    color: #1a0f1f;
    font-weight: 500;
  }
  .btn.primary:hover { background: #f09cb8; }

  .status-text {
    font-family: 'Caveat', cursive;
    font-size: 20px;
    color: var(--rose);
    margin-top: 14px;
    min-height: 24px;
    text-align: center;
  }
  .status-text.ok { color: var(--gold); }
  .status-text.bad { color: var(--danger); }

  /* finale letter */
  .finale-screen {
    display: none;
    width: 100%;
    background: radial-gradient(circle at 50% 0%, #3a1e45 0%, var(--panel) 100%);
    border: 1px solid var(--gold-soft);
    border-radius: 18px;
    padding: 36px 24px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    animation: fadeIn 1s ease;
  }
  .finale-screen.show { display: block; }
  .finale-screen .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 18px;
    display: block;
  }
  .finale-screen h2 {
    font-family: 'Caveat', cursive;
    font-size: 32px;
    line-height: 1.4;
    color: var(--cream);
    margin-bottom: 24px;
  }
  .finale-screen .note-content {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    color: var(--gold);
    margin: 16px 0 28px;
    line-height: 1.5;
  }
  .finale-screen .sign {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* floating hearts particles on completion */
  .heart-particle {
    position: fixed;
    pointer-events: none;
    color: var(--rose);
    animation: floatUp 3.5s ease-out forwards;
    z-index: 10;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(0.8); opacity: 1; }
    100% { transform: translateY(-120px) scale(1.4); opacity: 0; }
  }
</style>
</head>
<body>

<div class="stars"></div>
<div class="hearts-bg" id="heartsBg"></div>

<!-- Hidden native numeric input that summons the native iOS / Android phone keypad -->
<input id="nativeInput" type="tel" inputmode="numeric" pattern="[1-9]*" maxlength="1" autocomplete="off">

<!-- HTML5 local background audio -->
<audio id="bgAudio" preload="auto"></audio>

<div class="app-wrap">

  <!-- Top bar -->
  <div class="top-bar">
    <div class="level-dots" id="dots"></div>
    <button class="kiss-btn" id="kissBtn" aria-label="Pending kisses counter">
      <span class="kiss-icon">💋</span>
      <span id="kissCount">0</span>
      <span>kisses</span>
    </button>
  </div>

  <!-- Full Music Player -->
  <div class="music-player" id="musicPlayer">
    <div class="player-controls">
      <button class="player-btn" id="prevBtn" aria-label="Previous song" title="Previous song">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="player-btn play-pause-btn" id="playPauseBtn" aria-label="Play / Pause" title="Play">
        <svg id="playIcon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="player-btn" id="nextBtn" aria-label="Next song" title="Next song">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
    <div class="player-progress-wrap">
      <span class="player-time" id="currentTime">0:00</span>
      <input type="range" class="player-seekbar" id="seekBar" min="0" max="100" value="0" step="0.1" aria-label="Seek music track">
      <span class="player-time right" id="durationTime">0:00</span>
    </div>
  </div>

  <!-- Note so far -->
  <div class="note-card" id="noteCard">
    <div class="title" id="noteTitle">letter in progress</div>
    <div class="text" id="noteText"></div>
  </div>

  <!-- Main Game Section & The Diary Layout -->
  <div class="main-layout" id="mainLayout">
    <!-- Sudoku Column -->
    <div id="gameSection" class="board-column">
      <div class="board" id="board"></div>

      <!-- Controls -->
      <div class="controls">
        <button class="btn" id="clearBtn">clear</button>
        <button class="btn primary" id="checkBtn">unlock line ♥</button>
      </div>

      <div class="status-text" id="statusText"></div>
    </div>

    <!-- The Diary Panel (on the right) -->
    <div class="diary-card" id="diaryCard">
      <div class="diary-header">
        <h3 class="diary-title">The diary</h3>
      </div>
      <div class="diary-content" id="diaryContent"></div>
    </div>
  </div>

  <!-- Hearty "yayyyyy" Celebration Overlay -->
  <div class="yay-overlay" id="yayOverlay">
    <div class="yay-popup">
      <div class="yay-hearts">💖 ✨ 💕</div>
      <div class="yay-text">yayyyyy! ♥</div>
      <div class="yay-sub">level cleared</div>
    </div>
  </div>

  <!-- Finale Screen -->
  <div class="finale-screen" id="finaleScreen">
    <span class="eyebrow">every piece solved</span>
    <h2>you found every hidden word</h2>
    <div class="note-content" id="finaleContent"></div>
    <div class="sign" id="finaleSign">— forever & always ♥</div>
  </div>

</div>

<script>
// =========================================================================
// 💌 CUSTOMIZE YOUR MESSAGES & CONFIGURATION HERE
// =========================================================================
window.LOVE_CONFIG = {
  // Each item here represents a puzzle level phrase:
  phrases: [
    "Hi sweetaa",
    "How are you",
    "I miss you",
    "When will we meet",
    "I love you",
    "Forever yours"
  ],

  // Grand finale message displayed when all puzzles are solved:
  finaleMessage: "Every moment with you is my favorite puzzle solved. I love you endlessly ♥",

  // Audio playlist files (place in project folder):
  songFiles: [
    "song.mp3",
    "song2.mp3",
    "song3.mp3"
  ],

  // Optional external webhook URL to send HTTP POST notifications when kisses are added:
  kissWebhookUrl: "",

  // Permanent global cloud counter key (synced across all devices & users):
  cloudCounterKey: "lav_love_kisses_shared_live",

  // Secret reset key for resetting the counter programmatically
  secretResetKey: "sweetaa"
};

// =========================================================================
// PRESET SUDOKU PUZZLES (Matches solutions.md)
// =========================================================================
const PRESET_LEVELS = [
  {
    phrase: "Hi sweetaa",
    puzzle: [
      [0,8,0, 0,0,6, 9,0,0],
      [7,5,4, 1,9,0, 0,3,6],
      [0,9,0, 8,0,0, 2,0,0],
      [0,0,9, 0,0,1, 3,0,8],
      [0,0,7, 0,2,8, 0,9,1],

// =========================================================================
// SUDOKU ENGINE & PUZZLE GENERATOR
// =========================================================================
class SudokuEngine {
  static isValid(board, r, c, num) {
    for (let i = 0; i < 9; i++) {
      if (board[r][i] === num && i !== c) return false;
      if (board[i][c] === num && i !== r) return false;
    }
    const br = Math.floor(r / 3) * 3;
    const bc = Math.floor(c / 3) * 3;
    for (let dr = 0; dr < 3; dr++) {
      for (let dc = 0; dc < 3; dc++) {
        const nr = br + dr, nc = bc + dc;
        if (board[nr][nc] === num && (nr !== r || nc !== c)) return false;
      }
    }
    return true;
  }

  static solve(board) {
    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        if (board[r][c] === 0) {
          const digits = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
          for (let d of digits) {
            if (this.isValid(board, r, c, d)) {
              board[r][c] = d;
              if (this.solve(board)) return true;
              board[r][c] = 0;
            }
          }
          return false;
        }
      }
    }
    return true;
  }

  static generate(cluesCount = 34) {
    const solution = Array.from({length: 9}, () => Array(9).fill(0));
    this.solve(solution);

    const puzzle = solution.map(row => row.slice());
    const positions = [];
    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) positions.push([r, c]);
    positions.sort(() => Math.random() - 0.5);

    let removed = 0;
    const targetRemovals = 81 - cluesCount;
    for (const [r, c] of positions) {
      if (removed >= targetRemovals) break;
      puzzle[r][c] = 0;
      removed++;
    }
    return { puzzle, solution };
  }

  static isSudokuSolved(grid, originalPuzzle) {
    // 1. Check all cells are filled with valid numbers 1-9 and original given clues are preserved
    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        const val = grid[r][c];
        if (!val || val < 1 || val > 9) return false;
        if (originalPuzzle && originalPuzzle[r][c] !== 0 && originalPuzzle[r][c] !== val) {
          return false;
        }
      }
    }

    // 2. Check each row contains numbers 1-9 with no duplicates
    for (let r = 0; r < 9; r++) {
      const seen = new Set();
      for (let c = 0; c < 9; c++) {
        seen.add(grid[r][c]);
      }
      if (seen.size !== 9) return false;
    }

    // 3. Check each column contains numbers 1-9 with no duplicates
    for (let c = 0; c < 9; c++) {
      const seen = new Set();
      for (let r = 0; r < 9; r++) {
        seen.add(grid[r][c]);
      }
      if (seen.size !== 9) return false;
    }

    // 4. Check each 3x3 box contains numbers 1-9 with no duplicates
    for (let br = 0; br < 9; br += 3) {
      for (let bc = 0; bc < 9; bc += 3) {
        const seen = new Set();
        for (let r = br; r < br + 3; r++) {
          for (let c = bc; c < bc + 3; c++) {
            seen.add(grid[r][c]);
          }
        }
        if (seen.size !== 9) return false;
      }
    }

    return true;
  }
}

    if (PRESET_LEVELS[idx] && PRESET_LEVELS[idx].phrase === phrase) {
      return {
        phrase: PRESET_LEVELS[idx].phrase,
        puzzle: PRESET_LEVELS[idx].puzzle.map(row => row.slice()),
        solution: PRESET_LEVELS[idx].solution.map(row => row.slice())
      };
    }
    const { puzzle, solution } = SudokuEngine.generate(34);
    return { phrase, puzzle, solution };
  });

  let currentLevel = 0;
  const userGrids = levels.map(lvl => lvl.puzzle.map(row => row.slice()));
  const levelCompleted = new Array(N).fill(false);
  let selected = { r: 0, c: 0 };
  let currentSongIndex = 0; // declared here so loadGameState can restore it before music init
  let isSeeking = false;

  // =========================================================================
  // 💾 LOCALSTORAGE AUTOSAVE (Google Forms-like persistence)
  // =========================================================================
  const GAME_STORAGE_KEY = 'lav_sudoku_game_state_v1';

  function saveGameState() {
    try {
      const data = {
        currentLevel,
        levelCompleted,
        userGrids,
        currentSongIndex
      };
      localStorage.setItem(GAME_STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      console.warn("Autosave state error:", e);
    }
  }

  function loadGameState() {
    try {
      const raw = localStorage.getItem(GAME_STORAGE_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (data && Array.isArray(data.userGrids)) {
        for (let i = 0; i < N && i < data.userGrids.length; i++) {
          if (Array.isArray(data.userGrids[i])) {
            for (let r = 0; r < 9; r++) {
              for (let c = 0; c < 9; c++) {
                const given = levels[i].puzzle[r][c];
                if (given !== 0) {
                  userGrids[i][r][c] = given;
                } else if (typeof data.userGrids[i][r][c] === 'number') {
                  userGrids[i][r][c] = data.userGrids[i][r][c];
                }
              }
            }
          }
        }
        if (Array.isArray(data.levelCompleted)) {
          for (let i = 0; i < N && i < data.levelCompleted.length; i++) {
            levelCompleted[i] = Boolean(data.levelCompleted[i]);
          }
        }
        if (typeof data.currentLevel === 'number' && data.currentLevel >= 0 && data.currentLevel < N) {
          currentLevel = data.currentLevel;
        }
        // If the saved currentLevel is already completed (e.g. page was closed
        // during the 1.4s transition timeout), advance to the next incomplete level.
        while (currentLevel < N - 1 && levelCompleted[currentLevel]) {
          currentLevel++;
        }
        // Restore song index
        if (typeof data.currentSongIndex === 'number') {
          currentSongIndex = data.currentSongIndex;
        }
        return true;
      }
    } catch (e) {
      console.warn("Load state error:", e);
    }
    return false;
  }

    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function formatTime(seconds) {
    if (isNaN(seconds) || !isFinite(seconds) || seconds < 0) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  function loadSong(index, autoPlay = true) {
    currentSongIndex = (index + songPlaylist.length) % songPlaylist.length;
    bgAudio.src = songPlaylist[currentSongIndex];
    if (seekBar) seekBar.value = 0;
    if (currentTimeEl) currentTimeEl.textContent = '0:00';
    if (autoPlay) {
      bgAudio.play().catch(e => console.log("Playback gesture needed:", e));

  function togglePlayPause() {
    if (bgAudio.paused) {
      if (!bgAudio.src || bgAudio.src === '' || bgAudio.src.endsWith('/')) {
        loadSong(currentSongIndex, true);
      } else {
        bgAudio.play().catch(e => console.log("Play error:", e));
      }
    } else {
      bgAudio.pause();

  function updatePlayPauseUI() {

      const pct = (bgAudio.currentTime / bgAudio.duration) * 100;
      if (seekBar) seekBar.value = pct;
      if (currentTimeEl) currentTimeEl.textContent = formatTime(bgAudio.currentTime);
      if (durationTimeEl) durationTimeEl.textContent = formatTime(bgAudio.duration);
    }
  });

  bgAudio.addEventListener('loadedmetadata', () => {
    if (durationTimeEl) durationTimeEl.textContent = formatTime(bgAudio.duration);
  });

  // Automatically advance to the next song when finished
  bgAudio.addEventListener('ended', () => {
    loadSong(currentSongIndex + 1, true);
  });

  if (playPauseBtn) playPauseBtn.addEventListener('click', togglePlayPause);
  if (prevBtn) prevBtn.addEventListener('click', () => loadSong(currentSongIndex - 1, !bgAudio.paused));
  if (nextBtn) nextBtn.addEventListener('click', () => loadSong(currentSongIndex + 1, !bgAudio.paused));

  if (seekBar) {
    seekBar.addEventListener('input', () => {
      isSeeking = true;
      if (bgAudio.duration && currentTimeEl) {
        currentTimeEl.textContent = formatTime((seekBar.value / 100) * bgAudio.duration);
      }
    });
    seekBar.addEventListener('change', () => {
      if (bgAudio.duration) {
        bgAudio.currentTime = (seekBar.value / 100) * bgAudio.duration;
      }
      isSeeking = false;
    });
  }

  // Preload the last-played song (index restored from localStorage, or 0 on first visit)
  bgAudio.src = songPlaylist[currentSongIndex % songPlaylist.length];

  document.addEventListener('click', function onFirstClick() {

      bgAudio.play().catch(() => {});

        const v = grid[r][c];
        if (!v) continue;
        if (seen[v] !== undefined) { bad.add(seen[v]); bad.add(`${r},${c}`); }
        else seen[v] = `${r},${c}`;
      }
    }
    for (let c = 0; c < 9; c++) {
      const seen = {};
      for (let r = 0; r < 9; r++) {
        const v = grid[r][c];
        if (!v) continue;
        if (seen[v] !== undefined) { bad.add(seen[v]); bad.add(`${r},${c}`); }
        else seen[v] = `${r},${c}`;
      }
    }
    for (let br = 0; br < 9; br += 3) {
      for (let bc = 0; bc < 9; bc += 3) {
        const seen = {};
        for (let r = br; r < br + 3; r++) {
          for (let c = bc; c < bc + 3; c++) {
            const v = grid[r][c];
            if (!v) continue;
            if (seen[v] !== undefined) { bad.add(seen[v]); bad.add(`${r},${c}`); }
            else seen[v] = `${r},${c}`;
          }
        }
      }
    }
    return bad;

        if (c === 2 || c === 5) cell.classList.add('border-r');
        if (r === 2 || r === 5) cell.classList.add('border-b');
        if (conflicts.has(`${r},${c}`)) cell.classList.add('conflict');

        if (r === selected.r && c === selected.c) {
          cell.classList.add('selected');
        } else if (r === selected.r || c === selected.c || boxIndex(r,c) === boxIndex(selected.r, selected.c)) {
          cell.classList.add('highlight-axis');
        }

        if (val && selectedVal && val === selectedVal && !(r === selected.r && c === selected.c)) {
          cell.classList.add('highlight-same');
        }

        if (val) cell.textContent = val;

        cell.addEventListener('click', () => {
          selected = { r, c };
          renderBoard();
          triggerNativeInput();
        });

        boardEl.appendChild(cell);
      }
    }
  }

  clearBtn.addEventListener('click', () => {
    // Resets the in-memory grid only — does NOT write to localStorage.
    // If the user accidentally clears and then refreshes, the last autosaved
    // numbers (from their last keypress) will be restored. Only a refresh
    // AFTER clear followed by new entries will overwrite the save.
    userGrids[currentLevel] = levels[currentLevel].puzzle.map(row => row.slice());
    statusText.textContent = '';
    renderBoard();
  });

  checkBtn.addEventListener('click', () => {
    const lvl = levels[currentLevel];
    const grid = userGrids[currentLevel];
    const filled = grid.every(row => row.every(v => v !== 0));

    if (!filled) {
      statusText.textContent = 'a few boxes are still waiting ♥';
      statusText.className = 'status-text bad';
      return;
    }

    const conflicts = findConflicts(grid);
    if (conflicts.size > 0) {
      statusText.textContent = 'a little repeat in the red boxes';
      statusText.className = 'status-text bad';
      renderBoard();
      return;
    }

    if (!SudokuEngine.isSudokuSolved(grid, lvl.puzzle)) {
      statusText.textContent = 'almost there, check your steps ♥';
      statusText.className = 'status-text bad';
      return;
    }

    // Level Solved!
    levelCompleted[currentLevel] = true;
    const solvedIdx = currentLevel;
    saveGameState();
    showYayAnimation();
    renderDots();
    renderNote();
    renderDiary(solvedIdx);

    if (currentLevel < N - 1) {
      statusText.textContent = `"${lvl.phrase}" unlocked! moving to next line...`;
      statusText.className = 'status-text ok';
      setTimeout(() => {
        currentLevel++;
        selected = { r: 0, c: 0 };
        statusText.textContent = '';
        saveGameState();
        renderBoard();
        renderDots();
        renderNote();
      }, 1400);
    } else {
      setTimeout(() => {
        const mainLayout = document.getElementById('mainLayout');
        if (mainLayout) mainLayout.style.display = 'none';
        document.getElementById('noteCard').style.display = 'none';
        finaleScreen.classList.add('show');
        finaleContent.innerHTML = `"${PHRASES.join(' — ')}"<br><br>${escapeHtml(CFG.finaleMessage)}`;
        spawnHearts(30);
      }, 1200);
    }
  });

  function spawnHearts(count = 10) {
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const heart = document.createElement('div');
        heart.className = 'heart-particle';
        heart.textContent = ['♥', '♡', '💖', '✨'][Math.floor(Math.random() * 4)];
        heart.style.left = (15 + Math.random() * 70) + 'vw';
        heart.style.bottom = (20 + Math.random() * 40) + 'vh';
        heart.style.fontSize = (16 + Math.random() * 18) + 'px';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 3500);
      }, i * 150);
    }
  }

  function initHeartsBg() {
    const container = document.getElementById('heartsBg');
    if (!container) return;
    const glyphs = ['♥', '♡'];
    const count = window.innerWidth < 600 ? 24 : 38;
    for (let i = 0; i < count; i++) {
      const h = document.createElement('div');
      h.className = 'bg-heart' + (Math.random() < 0.3 ? ' gold' : '');
      h.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.top = Math.random() * 100 + 'vh';
      const size = 12 + Math.random() * 20;
      h.style.fontSize = size + 'px';
      h.style.animationDuration = (5 + Math.random() * 6) + 's';
      h.style.animationDelay = (Math.random() * 5) + 's';
      container.appendChild(h);
    }
  }

  // =========================================================================
  // 💋 PENDING KISSES COUNTER & EXTERNAL PING SYSTEM (LIVE)
  // =========================================================================
  const kissBtn = document.getElementById('kissBtn');
  const kissCountEl = document.getElementById('kissCount');
  const cloudKey = CFG.cloudCounterKey || 'lav_love_kisses_shared_live';
  const apiBase = 'https://countapi.mileshilliard.com/api/v1';

  let kissCount = parseInt(localStorage.getItem('pendingKisses') || '0', 10);
  if (isNaN(kissCount)) kissCount = 0;
  if (kissCountEl) kissCountEl.textContent = kissCount;

  function updateKissUI(val, persistLocal = true) {
    if (typeof val !== 'number' || isNaN(val)) return;
    kissCount = val;
    if (kissCountEl) kissCountEl.textContent = val;
    if (persistLocal) {
      localStorage.setItem('pendingKisses', val.toString());
    }
  }

  // Fetch live count from cloud counter
  function fetchLiveCount() {
    fetch(`${apiBase}/get/${cloudKey}`)
      .then(r => r.json())
      .then(data => {
        if (data && typeof data.value === 'number') {
          // Sync with highest counter value
          const synced = Math.max(kissCount, data.value);
          updateKissUI(synced);
        }
      })
      .catch(() => {});
  }

  // Initial fetch and live polling every 3.5 seconds
  fetchLiveCount();
  setInterval(fetchLiveCount, 3500);

  // Sync across tabs immediately
  window.addEventListener('storage', (e) => {
    if (e.key === 'pendingKisses') {
      const val = parseInt(e.newValue || '0', 10);
      if (!isNaN(val)) updateKissUI(val, false);
    }
  });

  function spawnKissParticle() {
    if (!kissBtn) return;
    const rect = kissBtn.getBoundingClientRect();
    const particle = document.createElement('div');
    particle.className = 'kiss-particle';
    particle.textContent = ['💋', '💖', '😘', '✨'][Math.floor(Math.random() * 4)];
    particle.style.left = (rect.left + rect.width / 2 - 10) + 'px';
    particle.style.top = (rect.top - 10) + 'px';
    document.body.appendChild(particle);
    setTimeout(() => particle.remove(), 1800);
  }

  function addKiss(amount = 1, silent = false) {
    const newCount = kissCount + amount;
    updateKissUI(newCount);

    if (!silent) spawnKissParticle();

    // Increment count on cloud server
    fetch(`${apiBase}/hit/${cloudKey}`)
      .then(r => r.json())
      .then(data => {
        if (data && typeof data.value === 'number') {
          updateKissUI(Math.max(newCount, data.value));
        }
      })
      .catch(() => {});

    // Webhook ping if configured
    if (CFG.kissWebhookUrl) {
      fetch(CFG.kissWebhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ event: 'kiss_added', count: newCount, amount, timestamp: new Date().toISOString() })
      }).catch(() => {});
    }

    window.dispatchEvent(new CustomEvent('kissAdded', { detail: { count: newCount, amount } }));
  }

  function resetKisses() {
    updateKissUI(0);
    // Reset on cloud counter API
    fetch(`${apiBase}/set/${cloudKey}?value=0`).catch(() => {});
    localStorage.setItem('pendingKisses', '0');
    statusText.textContent = 'pending kisses reset to 0 ♥';
    statusText.className = 'status-text ok';
    setTimeout(() => { if (statusText.textContent.includes('reset')) statusText.textContent = ''; }, 3000);
  }

  window.addKiss = addKiss;
  window.resetKisses = resetKisses;

  if (kissBtn) {
    kissBtn.addEventListener('click', (e) => {
      e.preventDefault();
      addKiss(1);
    });
  }

  // Secret reset trigger: Triple tap on "letter in progress" header title (Direct reset, no dialog)
  let titleTaps = 0;
  let titleTapTimer = null;
  if (noteTitleEl) {
    noteTitleEl.addEventListener('click', () => {
      titleTaps++;
      clearTimeout(titleTapTimer);
      if (titleTaps >= 3) {
        titleTaps = 0;
        resetKisses();
      } else {
        titleTapTimer = setTimeout(() => { titleTaps = 0; }, 800);
      }
    });
  }

  // Inbound URL parameter handlers:
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.has('kiss') || urlParams.has('addKiss') || urlParams.has('add_kiss')) {
    const amt = parseInt(urlParams.get('kiss') || urlParams.get('addKiss') || urlParams.get('add_kiss') || '1', 10);
    addKiss(isNaN(amt) ? 1 : amt);
  }
  if (urlParams.has('resetKisses') || urlParams.has('secretReset') || urlParams.has('reset_kisses')) {
    resetKisses();
  }

  // Initial load: restore saved state (if any)
  loadGameState();

  // Initial render
  initHeartsBg();
  renderDots();
  renderNote();
  renderDiary();
  renderBoard();

  if (levelCompleted.every(Boolean)) {
    const mainLayout = document.getElementById('mainLayout');
    if (mainLayout) mainLayout.style.display = 'none';
    document.getElementById('noteCard').style.display = 'none';
    finaleScreen.classList.add('show');
    finaleContent.innerHTML = `"${PHRASES.join(' — ')}"<br><br>${escapeHtml(CFG.finaleMessage)}`;
  }

  // =========================================================================
  // 🛡️ ACCIDENTAL REFRESH PROTECTION
  // Warns if the user is mid-solve and the in-memory grid differs from what's
  // saved in localStorage (i.e. they used "clear" and haven't re-entered yet).
  // =========================================================================
  window.addEventListener('beforeunload', (e) => {
    if (levelCompleted.every(Boolean)) return; // Finale: no warning needed
    const savedRaw = localStorage.getItem(GAME_STORAGE_KEY);
    let savedGrid = null;
    try {
      const savedData = JSON.parse(savedRaw);
      if (savedData && savedData.userGrids && savedData.userGrids[currentLevel]) {
        savedGrid = savedData.userGrids[currentLevel];
      }
    } catch (_) {}
    const current = userGrids[currentLevel];
    const hasUnsaved = savedGrid && current.some((row, r) =>
      row.some((val, c) => {
        const given = levels[currentLevel].puzzle[r][c];
        return given === 0 && val !== (savedGrid[r] ? savedGrid[r][c] : 0);
      })
    );
    if (hasUnsaved) {
      e.preventDefault();
      e.returnValue = ''; // Required for Chrome
    }
  });
})();
</script>
</body>
</html>
