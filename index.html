<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>for you ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a0f1f;
    --panel: #281730;
    --rose: #e587ad;
    --gold: #dfb277;
    --gold-soft: rgba(223, 178, 119, 0.3);
    --cream: #f8eee9;
    --muted: #a68b9d;
    --danger: #e66b6b;
    --line: rgba(248, 238, 233, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(1000px 500px at 50% 0%, #2f1738 0%, var(--bg) 100%);
    color: var(--cream);
    font-family: 'Cormorant Garamond', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 36px;
    overflow-x: hidden;
    touch-action: manipulation;
    -webkit-font-smoothing: antialiased;
  }

  /* ambient floating stars */
  .stars {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 30px 40px, rgba(248,238,233,0.3), transparent),
      radial-gradient(1px 1px at 150px 120px, rgba(229,135,173,0.3), transparent),
      radial-gradient(1.5px 1.5px at 320px 220px, rgba(223,178,119,0.35), transparent),
      radial-gradient(1px 1px at 450px 90px, rgba(248,238,233,0.25), transparent);
    background-size: 500px 300px;
    animation: drift 70s linear infinite;
  }
  @keyframes drift { from { background-position: 0 0; } to { background-position: 500px 300px; } }

  .app-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* top bar */
  .top-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .music-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    background: rgba(40, 23, 48, 0.7);
    border: 1px solid var(--gold-soft);
    padding: 6px 14px;
    border-radius: 999px;
    color: var(--gold);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.2s ease;
  }
  .music-btn:hover { border-color: var(--gold); background: rgba(51, 29, 61, 0.9); }
  .music-bars { display: flex; align-items: flex-end; gap: 2px; height: 10px; }
  .music-bars span { width: 2px; height: 3px; background: var(--gold); border-radius: 1px; }
  .music-btn.playing .music-bars span { animation: eq 0.8s ease-in-out infinite alternate; }
  .music-btn.playing .music-bars span:nth-child(2) { animation-delay: 0.2s; }
  .music-btn.playing .music-bars span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes eq { to { height: 10px; } }

  .level-dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(248, 238, 233, 0.2);
    transition: all 0.3s ease;
  }
  .dot.active { background: var(--rose); box-shadow: 0 0 8px rgba(229, 135, 173, 0.5); transform: scale(1.2); }
  .dot.done { background: var(--gold); }

  /* note preview card */
  .note-card {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 20px;
    margin-bottom: 18px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  }
  .note-card .title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .note-card .text {
    font-family: 'Caveat', cursive;
    font-size: 26px;
    color: var(--gold);
    min-height: 32px;
    line-height: 1.3;
    transition: all 0.3s ease;
  }
  .note-card .text .solved-part { color: var(--gold); }
  .note-card .text .locked-part { color: var(--muted); opacity: 0.4; letter-spacing: 2px; }

  /* sudoku grid */
  .board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    width: 100%;
    aspect-ratio: 1/1;
    background: var(--line);
    gap: 1px;
    border: 2px solid var(--gold-soft);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    margin-bottom: 18px;
  }
  .cell {
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(16px, 4.5vw, 20px);
    color: var(--cream);
    cursor: pointer;
    user-select: none;
    transition: background 0.15s ease;
    position: relative;
  }
  .cell.given {
    color: var(--muted);
    font-weight: 500;
    background: rgba(40, 23, 48, 0.85);
  }
  .cell.selected {
    background: rgba(229, 135, 173, 0.25) !important;
    box-shadow: inset 0 0 0 2px var(--rose);
  }
  .cell.highlight-same {
    background: rgba(223, 178, 119, 0.15);
  }
  .cell.highlight-axis {
    background: rgba(248, 238, 233, 0.04);
  }
  .cell.conflict {
    color: var(--danger) !important;
    background: rgba(230, 107, 107, 0.2) !important;
  }
  .cell.border-r { border-right: 2px solid var(--gold-soft); }
  .cell.border-b { border-bottom: 2px solid var(--gold-soft); }

  /* hidden input to smoothly summon native iOS/Android numeric keyboard */
  #nativeInput {
    position: absolute;
    opacity: 0;
    pointer-events: none;
    left: -9999px;
    top: -9999px;
    font-size: 16px; /* Prevents auto-zoom in iOS Safari */
    width: 1px;
    height: 1px;
  }

  /* actions */
  .controls {
    display: flex;
    gap: 12px;
    width: 100%;
  }
  .btn {
    flex: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid var(--gold-soft);
    background: rgba(40, 23, 48, 0.6);
    color: var(--gold);
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
  }
  .btn:hover { background: var(--gold); color: var(--bg); }
  .btn.primary {
    background: var(--rose);
    border-color: var(--rose);
    color: #1a0f1f;
    font-weight: 500;
  }
  .btn.primary:hover { background: #f09cb8; }

  .status-text {
    font-family: 'Caveat', cursive;
    font-size: 20px;
    color: var(--rose);
    margin-top: 14px;
    min-height: 24px;
    text-align: center;
  }
  .status-text.ok { color: var(--gold); }
  .status-text.bad { color: var(--danger); }

  /* finale letter */
  .finale-screen {
    display: none;
    width: 100%;
    background: radial-gradient(circle at 50% 0%, #3a1e45 0%, var(--panel) 100%);
    border: 1px solid var(--gold-soft);
    border-radius: 18px;
    padding: 36px 24px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    animation: fadeIn 1s ease;
  }
  .finale-screen.show { display: block; }
  .finale-screen .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 18px;
    display: block;
  }
  .finale-screen h2 {
    font-family: 'Caveat', cursive;
    font-size: 32px;
    line-height: 1.4;
    color: var(--cream);
    margin-bottom: 24px;
  }
  .finale-screen .note-content {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    color: var(--gold);
    margin: 16px 0 28px;
    line-height: 1.5;
  }
  .finale-screen .sign {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* floating hearts */
  .heart-particle {
    position: fixed;
    pointer-events: none;
    color: var(--rose);
    animation: floatUp 3.5s ease-out forwards;
    z-index: 10;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(0.8); opacity: 1; }
    100% { transform: translateY(-120px) scale(1.4); opacity: 0; }
  }
</style>
</head>
<body>

<div class="stars"></div>

<!-- Hidden native numeric input that summons the native iOS / Android phone keypad -->
<input id="nativeInput" type="tel" inputmode="numeric" pattern="[1-9]*" maxlength="1" autocomplete="off">

<!-- HTML5 local background audio -->
<audio id="bgAudio" loop preload="auto" src="song.mp3"></audio>

<div class="app-wrap">

  <!-- Top bar -->
  <div class="top-bar">
    <div class="level-dots" id="dots"></div>
    <button class="music-btn" id="musicBtn" aria-label="Toggle song">
      <div class="music-bars"><span></span><span></span><span></span></div>
      <span id="musicLabel">our song</span>
    </button>
  </div>

  <!-- Note so far -->
  <div class="note-card" id="noteCard">
    <div class="title" id="noteTitle">letter in progress</div>
    <div class="text" id="noteText"></div>
  </div>

  <!-- Main Game Section -->
  <div id="gameSection" style="width:100%;">
    <!-- Sudoku Board -->
    <div class="board" id="board"></div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn" id="clearBtn">clear</button>
      <button class="btn primary" id="checkBtn">unlock line ♥</button>
    </div>

    <div class="status-text" id="statusText"></div>
  </div>

  <!-- Finale Screen -->
  <div class="finale-screen" id="finaleScreen">
    <span class="eyebrow">every piece solved</span>
    <h2>you found every hidden word</h2>
    <div class="note-content" id="finaleContent"></div>
    <div class="sign" id="finaleSign">— forever & always ♥</div>
  </div>

</div>

<script>
// =========================================================================
// 💌 CUSTOMIZE YOUR MESSAGES HERE (Change or add lines anytime!)
// =========================================================================
window.LOVE_CONFIG = {
  // Each item here represents a puzzle level.
  // When completed, it reveals this phrase and unlocks the next level!
  phrases: [
    "Hi sweetaa",
    "How are you",
    "I miss you",
    "When will we meet",
    "I love you",
    "Forever yours"
  ],

  // The grand finale message displayed when all puzzles are solved:
  finaleMessage: "Every moment with you is my favorite puzzle solved. I love you endlessly ♥",

  // Audio file name (place your song.mp3 in the project folder):
  songFile: "song.mp3"
};

// =========================================================================
// SUDOKU ENGINE & PUZZLE GENERATOR
// =========================================================================
class SudokuEngine {
  static isValid(board, r, c, num) {
    for (let i = 0; i < 9; i++) {
      if (board[r][i] === num && i !== c) return false;
      if (board[i][c] === num && i !== r) return false;
    }
    const br = Math.floor(r / 3) * 3;
    const bc = Math.floor(c / 3) * 3;
    for (let dr = 0; dr < 3; dr++) {
      for (let dc = 0; dc < 3; dc++) {
        const nr = br + dr, nc = bc + dc;
        if (board[nr][nc] === num && (nr !== r || nc !== c)) return false;
      }
    }
    return true;
  }

  static solve(board) {
    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        if (board[r][c] === 0) {
          const digits = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
          for (let d of digits) {
            if (this.isValid(board, r, c, d)) {
              board[r][c] = d;
              if (this.solve(board)) return true;
              board[r][c] = 0;
            }
          }
          return false;
        }
      }
    }
    return true;
  }

  static generate(cluesCount = 34) {
    const solution = Array.from({length: 9}, () => Array(9).fill(0));
    this.solve(solution);

    // Create puzzle by removing cells while keeping enough clues
    const puzzle = solution.map(row => row.slice());
    const positions = [];
    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) positions.push([r, c]);
    positions.sort(() => Math.random() - 0.5);

    let removed = 0;
    const targetRemovals = 81 - cluesCount;
    for (const [r, c] of positions) {
      if (removed >= targetRemovals) break;
      puzzle[r][c] = 0;
      removed++;
    }
    return { puzzle, solution };
  }
}

// =========================================================================
// ROMANTIC AMBIENT AUDIO SYNTHESIZER (Fallback if song.mp3 isn't loaded)
// =========================================================================
class RomanticSynth {
  constructor() {
    this.ctx = null;
    this.isPlaying = false;
    this.timer = null;
  }
  start() {
    if (this.isPlaying) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.isPlaying = true;
      this.playChords();
    } catch(e) {}
  }
  stop() {
    this.isPlaying = false;
    if (this.timer) clearTimeout(this.timer);
    if (this.ctx) this.ctx.close();
  }
  playNote(freq, time, dur) {
    if (!this.ctx || !this.isPlaying) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, time);
    gain.gain.setValueAtTime(0.001, time);
    gain.gain.exponentialRampToValueAtTime(0.06, time + 0.1);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(time);
    osc.stop(time + dur);
  }
  playChords() {
    if (!this.isPlaying || !this.ctx) return;
    const chords = [
      [261.63, 329.63, 392.00, 523.25], // C
      [220.00, 261.63, 329.63, 440.00], // Am
      [174.61, 220.00, 261.63, 349.23], // F
      [196.00, 246.94, 293.66, 392.00]  // G
    ];
    const chord = chords[Math.floor(Math.random() * chords.length)];
    const now = this.ctx.currentTime;
    chord.forEach((freq, idx) => {
      this.playNote(freq, now + idx * 0.4, 2.5);
    });
    this.timer = setTimeout(() => this.playChords(), 2400);
  }
}

// =========================================================================
// GAME CONTROLLER
// =========================================================================
(function() {
  const CFG = window.LOVE_CONFIG;
  const PHRASES = CFG.phrases;
  const N = PHRASES.length;

  // Pre-generate puzzles for all configured phrases
  const levels = PHRASES.map(phrase => {
    const { puzzle, solution } = SudokuEngine.generate(34);
    return { phrase, puzzle, solution };
  });

  let currentLevel = 0;
  const userGrids = levels.map(lvl => lvl.puzzle.map(row => row.slice()));
  const levelCompleted = new Array(N).fill(false);
  let selected = { r: 0, c: 0 };

  // DOM Elements
  const dotsEl = document.getElementById('dots');
  const noteTextEl = document.getElementById('noteText');
  const boardEl = document.getElementById('board');
  const clearBtn = document.getElementById('clearBtn');
  const checkBtn = document.getElementById('checkBtn');
  const statusText = document.getElementById('statusText');
  const nativeInput = document.getElementById('nativeInput');
  const gameSection = document.getElementById('gameSection');
  const finaleScreen = document.getElementById('finaleScreen');
  const finaleContent = document.getElementById('finaleContent');

  // Audio setup
  const bgAudio = document.getElementById('bgAudio');
  const musicBtn = document.getElementById('musicBtn');
  const musicLabel = document.getElementById('musicLabel');
  const synth = new RomanticSynth();
  let audioActive = false;

  function toggleMusic() {
    if (!audioActive) {
      bgAudio.src = CFG.songFile || 'song.mp3';
      const playPromise = bgAudio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          musicBtn.classList.add('playing');
          musicLabel.textContent = 'playing ♥';
          audioActive = true;
        }).catch(() => {
          // If song.mp3 fails or isn't found, fallback smoothly to romantic synthesizer!
          synth.start();
          musicBtn.classList.add('playing');
          musicLabel.textContent = 'melody ♥';
          audioActive = true;
        });
      }
    } else {
      bgAudio.pause();
      synth.stop();
      musicBtn.classList.remove('playing');
      musicLabel.textContent = 'our song';
      audioActive = false;
    }
  }
  musicBtn.addEventListener('click', toggleMusic);

  // Auto-attempt music on first click anywhere
  document.addEventListener('click', function onFirstClick() {
    if (!audioActive) toggleMusic();
    document.removeEventListener('click', onFirstClick);
  }, { once: true });

  // Native input focus for iPhone & Android
  function triggerNativeInput() {
    nativeInput.value = '';
    nativeInput.focus();
  }

  nativeInput.addEventListener('input', (e) => {
    const val = e.target.value.replace(/[^1-9]/g, '');
    if (val) {
      setCellVal(parseInt(val.slice(-1), 10));
    }
    nativeInput.value = '';
  });

  nativeInput.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' || e.key === 'Delete') {
      setCellVal(0);
    }
  });

  // Physical PC Keyboard Listener
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1, 0); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1, 0); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); moveSel(0, -1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); moveSel(0, 1); }
    else if (e.key >= '1' && e.key <= '9') { setCellVal(parseInt(e.key, 10)); }
    else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') { setCellVal(0); }
  });

  function moveSel(dr, dc) {
    selected.r = (selected.r + dr + 9) % 9;
    selected.c = (selected.c + dc + 9) % 9;
    renderBoard();
  }

  function setCellVal(val) {
    const lvl = levels[currentLevel];
    if (lvl.puzzle[selected.r][selected.c] !== 0) return; // Given clue
    userGrids[currentLevel][selected.r][selected.c] = val;
    statusText.textContent = '';
    statusText.className = 'status-text';
    renderBoard();
  }

  function boxIndex(r, c) {
    return Math.floor(r / 3) * 3 + Math.floor(c / 3);
  }

  function findConflicts(grid) {
    const bad = new Set();
    for (let r = 0; r < 9; r++) {
      const seen = {};
      for (let c = 0; c < 9; c++) {
        const v = grid[r][c];
        if (!v) continue;
        if (seen[v] !== undefined) { bad.add(seen[v]); bad.add(`${r},${c}`); }
        else seen[v] = `${r},${c}`;
      }
    }
    for (let c = 0; c < 9; c++) {
      const seen = {};
      for (let r = 0; r < 9; r++) {
        const v = grid[r][c];
        if (!v) continue;
        if (seen[v] !== undefined) { bad.add(seen[v]); bad.add(`${r},${c}`); }
        else seen[v] = `${r},${c}`;
      }
    }
    for (let br = 0; br < 9; br += 3) {
      for (let bc = 0; bc < 9; bc += 3) {
        const seen = {};
        for (let r = br; r < br + 3; r++) {
          for (let c = bc; c < bc + 3; c++) {
            const v = grid[r][c];
            if (!v) continue;
            if (seen[v] !== undefined) { bad.add(seen[v]); bad.add(`${r},${c}`); }
            else seen[v] = `${r},${c}`;
          }
        }
      }
    }
    return bad;
  }

  function renderDots() {
    dotsEl.innerHTML = '';
    for (let i = 0; i < N; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot' + (levelCompleted[i] ? ' done' : (i === currentLevel ? ' active' : ''));
      dotsEl.appendChild(dot);
    }
  }

  function renderNote() {
    const parts = [];
    for (let i = 0; i < N; i++) {
      if (levelCompleted[i]) {
        parts.push(`<span class="solved-part">${escapeHtml(PHRASES[i])}</span>`);
      } else if (i === currentLevel) {
        parts.push(`<span class="locked-part">· · ·</span>`);
      }
    }
    noteTextEl.innerHTML = parts.join(' &nbsp;—&nbsp; ');
  }

  function renderBoard() {
    boardEl.innerHTML = '';
    const lvl = levels[currentLevel];
    const grid = userGrids[currentLevel];
    const conflicts = findConflicts(grid);
    const selectedVal = grid[selected.r][selected.c];

    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        const cell = document.createElement('div');
        const isGiven = lvl.puzzle[r][c] !== 0;
        const val = grid[r][c];

        cell.className = 'cell';
        if (isGiven) cell.classList.add('given');
        if (c === 2 || c === 5) cell.classList.add('border-r');
        if (r === 2 || r === 5) cell.classList.add('border-b');
        if (conflicts.has(`${r},${c}`)) cell.classList.add('conflict');

        if (r === selected.r && c === selected.c) {
          cell.classList.add('selected');
        } else if (r === selected.r || c === selected.c || boxIndex(r,c) === boxIndex(selected.r, selected.c)) {
          cell.classList.add('highlight-axis');
        }

        if (val && selectedVal && val === selectedVal && !(r === selected.r && c === selected.c)) {
          cell.classList.add('highlight-same');
        }

        if (val) cell.textContent = val;

        cell.addEventListener('click', () => {
          selected = { r, c };
          renderBoard();
          triggerNativeInput();
        });

        boardEl.appendChild(cell);
      }
    }
  }

  clearBtn.addEventListener('click', () => {
    userGrids[currentLevel] = levels[currentLevel].puzzle.map(row => row.slice());
    statusText.textContent = '';
    renderBoard();
  });

  checkBtn.addEventListener('click', () => {
    const lvl = levels[currentLevel];
    const grid = userGrids[currentLevel];
    const filled = grid.every(row => row.every(v => v !== 0));

    if (!filled) {
      statusText.textContent = 'a few boxes are still waiting ♥';
      statusText.className = 'status-text bad';
      return;
    }

    const conflicts = findConflicts(grid);
    if (conflicts.size > 0) {
      statusText.textContent = 'a little repeat in the red boxes';
      statusText.className = 'status-text bad';
      renderBoard();
      return;
    }

    let isCorrect = true;
    for (let r = 0; r < 9 && isCorrect; r++) {
      for (let c = 0; c < 9; c++) {
        if (grid[r][c] !== lvl.solution[r][c]) { isCorrect = false; break; }
      }
    }

    if (!isCorrect) {
      statusText.textContent = 'almost there, check your steps ♥';
      statusText.className = 'status-text bad';
      return;
    }

    // Level Solved!
    levelCompleted[currentLevel] = true;
    spawnHearts();
    renderDots();
    renderNote();

    if (currentLevel < N - 1) {
      statusText.textContent = `"${lvl.phrase}" unlocked! moving to next line...`;
      statusText.className = 'status-text ok';
      setTimeout(() => {
        currentLevel++;
        selected = { r: 0, c: 0 };
        statusText.textContent = '';
        renderBoard();
        renderDots();
        renderNote();
      }, 1200);
    } else {
      // Completed all puzzles
      setTimeout(() => {
        gameSection.style.display = 'none';
        document.getElementById('noteCard').style.display = 'none';
        finaleScreen.classList.add('show');
        finaleContent.innerHTML = `"${PHRASES.join(' — ')}"<br><br>${escapeHtml(CFG.finaleMessage)}`;
        spawnHearts(25);
      }, 1000);
    }
  });

  function spawnHearts(count = 10) {
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const heart = document.createElement('div');
        heart.className = 'heart-particle';
        heart.textContent = ['♥', '♡', '💖', '✨'][Math.floor(Math.random() * 4)];
        heart.style.left = (15 + Math.random() * 70) + 'vw';
        heart.style.bottom = (20 + Math.random() * 40) + 'vh';
        heart.style.fontSize = (16 + Math.random() * 18) + 'px';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 3500);
      }, i * 150);
    }
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Initial render
  renderDots();
  renderNote();
  renderBoard();
})();
</script>
</body>
</html>
